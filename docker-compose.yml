version: '3.8'

services:
  quantum-tunneling:
    build: .
    container_name: quantum-tunneling-demo
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - experiments_data:/app/experiments.json
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - quantum-network

volumes:
  experiments_data:
    driver: local

networks:
  quantum-network:
    driver: bridge
